[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-aircraft-doppler-geolocation"
version = "0.3.0"
description = "Hermes plugin: geolocate recordings from aircraft Doppler curves and ADS-B tracks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kyle Durepos" }]
keywords = ["hermes", "osint", "geolocation", "doppler", "ads-b"]
dependencies = [
  "numpy>=1.26,<2.6",
  "scipy>=1.11,<1.19",
  "soundfile>=0.12,<0.15",
  "matplotlib>=3.8,<3.12",
  "tifffile>=2023.7.10,<2027",
]

[project.optional-dependencies]
dev = ["pyyaml>=6,<7", "pytest>=8,<10", "ruff==0.17.3"]
fast = ["orjson>=3.9,<4"]

[project.scripts]
dopplergeo = "dopplergeo.__main__:main"

[project.urls]
Homepage = "https://github.com/mojomast/hermes-aircraft-doppler-geolocation"

[tool.setuptools.packages.find]
include = ["dopplergeo*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]  # plugin entrypoint lives at the repo root by Hermes convention
"dopplergeo/__main__.py" = ["N999"]  # repo dir name is not a module name
"dopplergeo/*.py" = ["SIM115", "RUF046", "FURB162", "TRY004"]  # lazy openers; py3.10 fromisoformat; explicit int()
"tests/ref_*_f65a6a2.py" = ["SIM115", "RUF046", "FURB162", "TRY004"]  # frozen copies of dopplergeo modules
