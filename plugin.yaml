name: aircraft-doppler-geolocation
version: "0.2.0"
description: >-
  Detect aircraft flyover Doppler tones in a recording and estimate where it
  was made by scoring them against adsb.lol ADS-B history. Downloads public
  ADS-B, DEM and weather data (no account); offline mode uses the cache only.
author: mojomast
license: MIT
homepage: https://github.com/mojomast/hermes-aircraft-doppler-geolocation
tags:
  - osint
  - geolocation
  - audio
  - skills
manifest_version: 2
api_version: 1
provides_tools:
  - doppler_detect
  - doppler_locate
provides_hooks: []
provides_middleware: []
requires_env: []
# Kept in step with pyproject.toml. pyproject.toml is what Hermes installs.
python_dependencies:
  - "numpy>=1.26,<2.6"
  - "scipy>=1.11,<1.19"
  - "soundfile>=0.12,<0.15"
  - "matplotlib>=3.8,<3.12"
  - "tifffile>=2023.7.10,<2027"
